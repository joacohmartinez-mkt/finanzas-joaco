<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Finanzas · Joaco</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f4f4f3;--surf:#fff;--brd:#e5e5e3;
  --t1:#171717;--t2:#525252;--t3:#a3a3a3;
  --grn:#16a34a;--grnl:#dcfce7;
  --red:#dc2626;--redl:#fee2e2;
  --blue:#2563eb;--bluel:#eff6ff;
  --acc:#f59e0b;--accl:#fef9c3;
  --r:16px;--rs:11px;
  --nav-h:62px;
  --sh:0 1px 4px rgba(0,0,0,.07);
  --sh2:0 4px 16px rgba(0,0,0,.1);
}
html{height:100%;background:var(--bg)}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--t1);height:100%;overflow:hidden;max-width:430px;margin:0 auto}
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
.top-bar{flex-shrink:0;background:var(--surf);border-bottom:1px solid var(--brd);padding:calc(env(safe-area-inset-top,0px)+10px) 18px 10px;display:flex;align-items:center;justify-content:space-between}
.app-name{font-size:13px;font-weight:700;color:var(--t1)}
.month-nav{display:flex;align-items:center;gap:10px}
.mn-btn{background:none;border:none;cursor:pointer;color:var(--t2);font-size:20px;padding:4px;line-height:1;-webkit-user-select:none;user-select:none}
#mlbl{font-size:14px;font-weight:600;min-width:116px;text-align:center}
.gear-btn{background:none;border:none;cursor:pointer;color:var(--t2);font-size:20px;padding:4px}
.tab-content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 8px)}
.bot-nav{flex-shrink:0;background:var(--surf);border-top:1px solid var(--brd);display:flex;height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;gap:3px;color:var(--t3);-webkit-user-select:none;user-select:none;transition:color .15s}
.nav-item.a{color:var(--blue)}
.nav-ico{font-size:22px;line-height:1}.nav-lbl{font-size:10px;font-weight:500}

/* HOME CARD */
.home-card{background:var(--surf);border-radius:var(--r);margin:14px 14px 0;box-shadow:var(--sh2);border:1px solid var(--brd);overflow:hidden}
.saldo-top{padding:20px 20px 16px}
.saldo-lbl{font-size:12px;font-weight:500;color:var(--t3);margin-bottom:6px}
.saldo-num{font-size:36px;font-weight:700;letter-spacing:-1.5px;line-height:1;margin-bottom:16px;color:var(--t1)}
.saldo-num.pos{color:var(--grn)}.saldo-num.neg{color:var(--red)}
.saldo-breakdown{border-top:1px solid var(--brd);padding:0 20px}
.saldo-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--brd)}
.saldo-row:last-child{border-bottom:none}
.saldo-row-l{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--t2)}
.saldo-ico{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.saldo-ico.g{background:var(--grnl);color:var(--grn)}
.saldo-ico.r{background:var(--redl);color:var(--red)}
.saldo-ico.n{background:var(--bg);color:var(--t2);font-size:15px}
.saldo-val{font-size:15px;font-weight:600}
.saldo-val.g{color:var(--grn)}.saldo-val.r{color:var(--red)}.saldo-val.n{color:var(--t1)}
.action-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 16px;background:var(--bg);border-top:1px solid var(--brd)}
.act-btn{padding:12px;border-radius:var(--rs);border:none;font-family:'Inter',sans-serif;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:opacity .15s;-webkit-user-select:none;user-select:none}
.act-btn:active{opacity:.82}
.act-btn.egr{background:var(--redl);color:var(--red)}
.act-btn.ing{background:var(--grnl);color:var(--grn)}

/* MOV LIST */
.date-grp{padding:0 14px;margin-top:14px}
.date-hdr{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.date-day{font-size:26px;font-weight:700;color:var(--t1);line-height:1}
.date-info{display:flex;flex-direction:column}
.date-wd{font-size:12px;font-weight:600;color:var(--t2);text-transform:capitalize}
.date-mo{font-size:11px;color:var(--t3)}
.mov-item{background:var(--surf);border:1px solid var(--brd);border-radius:var(--rs);padding:10px 12px;margin-bottom:6px;box-shadow:var(--sh)}
.mov-main{display:flex;align-items:center;gap:10px}
.mov-ico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.mov-ico.i{background:var(--grnl)}.mov-ico.e{background:var(--redl)}
.mov-info{flex:1;min-width:0}
.mov-motivo{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.mov-meta{display:flex;align-items:center;gap:5px}
.cat-tag{font-size:10px;font-weight:500;padding:2px 7px;border-radius:20px;background:var(--bg);color:var(--t2);border:1px solid var(--brd);white-space:nowrap}
.mov-met{font-size:10px;color:var(--t3)}
.mov-btns{display:flex;align-items:center;gap:6px;flex-shrink:0}
.mov-tog{background:var(--bg);border:1px solid var(--brd);border-radius:7px;padding:5px 8px;cursor:pointer;font-size:11px;color:var(--t2);font-family:'Inter',sans-serif;transition:background .12s;-webkit-user-select:none;user-select:none}
.mov-tog:active{background:var(--brd)}
.mov-edit{background:var(--bluel);border:1px solid #bfdbfe;border-radius:7px;padding:5px 8px;cursor:pointer;font-size:12px;color:var(--blue);font-family:'Inter',sans-serif;-webkit-user-select:none;user-select:none}
.mov-amt-row{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--brd)}
.mov-amt{font-size:16px;font-weight:700}
.mov-amt.i{color:var(--grn)}.mov-amt.e{color:var(--red)}
.mov-date{font-size:11px;color:var(--t3)}
.mov-nota{font-size:11px;color:var(--t3);font-style:italic;margin-top:4px}

/* EMPTY / SPIN */
.empty{text-align:center;padding:44px 20px;color:var(--t3)}
.empty-ico{font-size:32px;margin-bottom:10px;opacity:.5}
.empty-ttl{font-size:15px;font-weight:600;color:var(--t2);margin-bottom:4px}
.empty-sub{font-size:12px;line-height:1.6}
.spin{width:18px;height:18px;border:2px solid var(--brd);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* DASHBOARD */
.period-bar{display:flex;background:var(--bg);border-bottom:1px solid var(--brd);padding:8px 14px;gap:6px;flex-shrink:0}
.ps-btn{flex:1;padding:8px;border-radius:8px;border:1px solid var(--brd);background:var(--surf);font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;color:var(--t2);transition:all .14s;-webkit-user-select:none;user-select:none}
.ps-btn.a{background:var(--blue);color:#fff;border-color:var(--blue)}
.chart-card{background:var(--surf);border:1px solid var(--brd);border-radius:var(--r);margin:12px 14px 0;padding:16px;box-shadow:var(--sh)}
.chart-title{font-size:13px;font-weight:700;color:var(--t1);margin-bottom:12px}
.progress-card{background:var(--surf);border:1px solid var(--brd);border-radius:var(--r);margin:14px 14px 0;padding:16px;box-shadow:var(--sh)}
.prog-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.prog-ttl{font-size:13px;font-weight:700}
.prog-vals{font-size:11px;color:var(--t2)}
.prog-track{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;border:1px solid var(--brd)}
.prog-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--grn),#4ade80);transition:width .6s ease}
.prog-pct{font-size:11px;color:var(--t3);margin-top:5px}
.hbar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.hbar-row:last-child{margin-bottom:0}
.hbar-ico{font-size:14px;width:18px;flex-shrink:0;text-align:center}
.hbar-name{font-size:11.5px;color:var(--t2);width:100px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar-track{flex:1;height:6px;background:var(--bg);border-radius:3px;overflow:hidden;border:1px solid var(--brd)}
.hbar-fill{height:100%;border-radius:3px;transition:width .5s ease}
.hbar-amt{font-size:11px;font-weight:600;color:var(--t1);width:72px;text-align:right;flex-shrink:0}
.donut-wrap{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.donut-legend{flex:1;display:flex;flex-direction:column;gap:6px}
.leg-item{display:flex;align-items:center;gap:7px}
.leg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.leg-name{font-size:11px;color:var(--t2);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leg-pct{font-size:11px;font-weight:600;color:var(--t1);min-width:28px;text-align:right}
.trend-labels{display:flex;padding:0 6px;margin-top:4px}
.trend-lbl{font-size:10px;color:var(--t3);flex:1;text-align:center}
.no-data{text-align:center;padding:16px;font-size:12px;color:var(--t3);font-style:italic}

/* AI REC CARD */
.rec-card{background:var(--surf);border:1px solid var(--brd);border-radius:var(--r);margin:12px 14px 0;overflow:hidden;box-shadow:var(--sh)}
.rec-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;-webkit-user-select:none;user-select:none}
.rec-header:active{background:var(--bg)}
.rec-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.rec-badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--accl);color:#92400e;border:1px solid #fde68a}
.rec-chev{font-size:12px;color:var(--t3);transition:transform .2s}
.rec-chev.open{transform:rotate(180deg)}
.rec-body{padding:0 16px 16px;border-top:1px solid var(--brd)}
.rec-loading{display:flex;align-items:center;gap:10px;padding:14px 0;color:var(--t2);font-size:13px}
.rec-spin{width:16px;height:16px;border:2px solid var(--brd);border-top-color:var(--acc);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
.rec-text{font-size:13px;color:var(--t2);line-height:1.7;padding-top:12px}
.rec-refresh{margin-top:10px;background:none;border:1px solid var(--brd);border-radius:8px;padding:6px 12px;font-family:'Inter',sans-serif;font-size:11px;color:var(--t3);cursor:pointer}

/* PORTFOLIO */
.port-total{background:var(--bluel);border:1px solid #bfdbfe;border-radius:var(--r);padding:16px;margin:14px 14px 0}
.pt-lbl{font-size:11px;font-weight:600;color:#1d4ed8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.pt-val{font-size:24px;font-weight:700;color:#1d4ed8;letter-spacing:-.5px}
.pt-sub{font-size:12px;color:#3b82f6;margin-top:3px}
.pos-card{background:var(--surf);border:1px solid var(--brd);border-radius:var(--r);margin:10px 14px 0;padding:14px;box-shadow:var(--sh)}
.pos-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.pos-ticker{width:44px;height:44px;border-radius:11px;background:var(--bluel);border:1px solid #bfdbfe;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#1d4ed8;flex-shrink:0;text-align:center;line-height:1.1}
.pos-inf{flex:1;min-width:0}
.pos-name{font-size:13px;font-weight:600;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos-sub{font-size:10px;color:var(--t3)}
.pos-r{text-align:right;flex-shrink:0}
.pos-uyu{font-size:14px;font-weight:700;color:var(--t1)}
.pos-pl{font-size:11px;font-weight:600;margin-top:2px}
.pos-pl.up{color:var(--grn)}.pos-pl.dn{color:var(--red)}
.pos-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;background:var(--bg);border-radius:var(--rs);padding:10px}
.pcl{font-size:10px;color:var(--t3);font-weight:500;margin-bottom:3px}
.pcv{font-size:12px;font-weight:600;color:var(--t1)}
.pos-inp{width:100%;background:var(--surf);border:1px solid #bfdbfe;border-radius:6px;color:#1d4ed8;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;padding:3px 6px;outline:none;text-align:center}

/* CONFIG */
.conf-section{margin:14px 14px 0}
.conf-block{background:var(--surf);border:1px solid var(--brd);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:var(--sh)}
.conf-lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--t2);margin-bottom:10px}
.conf-inp{width:100%;border:1px solid var(--brd);border-radius:9px;padding:10px 13px;font-family:'Inter',sans-serif;font-size:14px;color:var(--t1);background:var(--bg);outline:none;transition:border-color .15s}
.conf-inp:focus{border-color:var(--blue)}
.conf-inp::placeholder{color:var(--t3)}
.conf-row-i{display:flex;gap:8px;align-items:center;margin-top:8px}
.conf-inp-s{flex:1;border:1px solid var(--brd);border-radius:9px;padding:10px 12px;font-family:'Inter',sans-serif;font-size:14px;color:var(--t1);background:var(--bg);outline:none;transition:border-color .15s}
.conf-inp-s:focus{border-color:var(--blue)}
.conf-unit{font-size:13px;color:var(--t2);font-weight:500;white-space:nowrap}
.conf-btn{padding:10px 16px;background:var(--blue);color:#fff;border:none;border-radius:9px;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:opacity .15s}
.conf-btn:active{opacity:.85}
.stat-row{display:flex;align-items:center;gap:8px;margin-top:10px}
.stat-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.stat-dot.ok{background:var(--grn)}.stat-dot.off{background:var(--red)}
.stat-txt{font-size:12px;color:var(--t2)}

/* FORM OVERLAY */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:30;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .22s}
.ov.open{opacity:1;pointer-events:all}
.sheet{background:var(--surf);border-radius:20px 20px 0 0;width:100%;max-height:92vh;display:flex;flex-direction:column;transform:translateY(40px);transition:transform .3s cubic-bezier(.22,1,.36,1);box-shadow:0 -4px 24px rgba(0,0,0,.12)}
.ov.open .sheet{transform:translateY(0)}
.handle{width:36px;height:4px;background:var(--brd);border-radius:2px;margin:10px auto 0;flex-shrink:0}
.sheet-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--brd);flex-shrink:0}
.sheet-ttl{font-size:16px;font-weight:700}
.sheet-close{background:var(--bg);border:1px solid var(--brd);color:var(--t2);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;line-height:1}
.edit-bar{display:flex;align-items:center;justify-content:space-between;background:var(--bluel);border-bottom:1px solid #bfdbfe;padding:8px 18px;flex-shrink:0}
.edit-lbl{font-size:12px;font-weight:600;color:var(--blue);display:flex;align-items:center;gap:5px}
.edit-lbl::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--blue)}
.edit-cancel{font-size:12px;color:var(--blue);background:none;border:none;cursor:pointer;font-family:'Inter',sans-serif;font-weight:600}
.sheet-body{flex:1;overflow-y:auto;padding:14px 18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.fg{margin-bottom:14px}
.fg-lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--t2);margin-bottom:8px;display:block}
.type-toggle{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);border-radius:11px;padding:4px;border:1px solid var(--brd);margin-bottom:14px}
.type-btn{padding:10px;border-radius:8px;border:none;cursor:pointer;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;background:transparent;color:var(--t2);transition:all .15s;-webkit-user-select:none;user-select:none}
.type-btn.ae{background:var(--redl);color:var(--red)}
.type-btn.ai{background:var(--grnl);color:var(--grn)}
.amt-display{text-align:center;padding:6px 0 12px;border-bottom:1px solid var(--brd);margin-bottom:14px}
.amt-cur{font-size:18px;color:var(--t2);vertical-align:top;margin-top:6px;display:inline-block}
.amt-num{font-size:42px;font-weight:700;letter-spacing:-1px;color:var(--t1);display:inline-block;min-width:10px}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
.np{height:50px;border-radius:10px;border:1px solid var(--brd);background:var(--bg);color:var(--t1);font-family:'Inter',sans-serif;font-size:22px;font-weight:400;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .1s;-webkit-user-select:none;user-select:none}
.np:active{background:var(--brd)}.np.del{font-size:17px;color:var(--t2)}
.fi{width:100%;border:1px solid var(--brd);border-radius:10px;padding:11px 13px;font-family:'Inter',sans-serif;font-size:14px;color:var(--t1);background:var(--bg);outline:none;transition:border-color .15s;-webkit-appearance:none}
.fi:focus{border-color:var(--blue);background:var(--surf)}
.fi::placeholder{color:var(--t3)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:7px 13px;border-radius:20px;border:1px solid var(--brd);background:var(--surf);font-size:12px;font-weight:500;color:var(--t2);cursor:pointer;transition:all .14s;-webkit-user-select:none;user-select:none;white-space:nowrap}
.chip.s{border-color:var(--blue);background:var(--bluel);color:var(--blue)}
.chip.se{border-color:var(--red);background:var(--redl);color:var(--red)}
.chip.si{border-color:var(--grn);background:var(--grnl);color:var(--grn)}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}
.ccell{padding:9px 4px;border-radius:10px;border:1px solid var(--brd);background:var(--surf);text-align:center;cursor:pointer;transition:all .14s;display:flex;flex-direction:column;align-items:center;gap:3px;-webkit-user-select:none;user-select:none}
.ccell:active{background:var(--bg)}
.cico{font-size:18px;line-height:1}.cname{font-size:10px;color:var(--t2);font-weight:500;line-height:1.2}
.ccell.se{border-color:var(--red);background:var(--redl)}.ccell.se .cname{color:var(--red)}
.ccell.si{border-color:var(--grn);background:var(--grnl)}.ccell.si .cname{color:var(--grn)}
.savebtn{width:100%;padding:14px;border-radius:11px;border:none;background:var(--blue);color:#fff;font-family:'Inter',sans-serif;font-size:15px;font-weight:600;cursor:pointer;margin-bottom:8px;transition:opacity .15s}
.savebtn:active{opacity:.85}
.delbtn{width:100%;padding:12px;border-radius:11px;border:1px solid var(--red);background:var(--redl);color:var(--red);font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:8px;transition:opacity .15s}
.delbtn:active{opacity:.75}

/* CONFIRM */
.conf-dial{position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .15s}
.conf-dial.open{opacity:1;pointer-events:all}
.conf-card{background:var(--surf);border-radius:16px;padding:22px;width:100%;max-width:280px;box-shadow:var(--sh2)}
.cc-ttl{font-size:16px;font-weight:700;margin-bottom:6px}
.cc-sub{font-size:13px;color:var(--t2);margin-bottom:18px;line-height:1.5}
.cc-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.cc-cancel{padding:11px;border:1px solid var(--brd);border-radius:9px;background:var(--bg);color:var(--t2);font-family:'Inter',sans-serif;font-size:13px;cursor:pointer}
.cc-ok{padding:11px;border:none;border-radius:9px;background:var(--red);color:#fff;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer}

/* TOAST */
.toast{position:fixed;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 12px);left:50%;transform:translateX(-50%) translateY(10px);background:var(--t1);color:#fff;padding:9px 18px;border-radius:22px;font-size:13px;font-weight:500;opacity:0;transition:opacity .2s,transform .2s;z-index:60;white-space:nowrap;pointer-events:none;box-shadow:var(--sh2)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#dhidden{position:fixed;opacity:0;pointer-events:none;top:50%;left:50%;width:1px;height:1px}
</style>
</head>
<body>
<div id="app">
  <div class="top-bar">
    <span class="app-name">Finanzas · Joaco</span>
    <div class="month-nav">
      <button class="mn-btn" onclick="prevM()">‹</button>
      <span id="mlbl">Mayo 2026</span>
      <button class="mn-btn" onclick="nextM()">›</button>
    </div>
    <button class="gear-btn" onclick="setTab(2)">⚙</button>
  </div>
  <div class="period-bar" id="period-bar" style="display:none">
    <button class="ps-btn" id="ps-sem" onclick="setPeriod('semana')">Semana</button>
    <button class="ps-btn a" id="ps-mes" onclick="setPeriod('mes')">Mes</button>
    <button class="ps-btn" id="ps-tri" onclick="setPeriod('trimestre')">Trimestre</button>
  </div>
  <div class="tab-content" id="tc"></div>
  <div class="bot-nav">
    <div class="nav-item a" id="nav0" onclick="setTab(0)"><div class="nav-ico">🏠</div><div class="nav-lbl">Principal</div></div>
    <div class="nav-item" id="nav1" onclick="setTab(1)"><div class="nav-ico">📊</div><div class="nav-lbl">Dashboard</div></div>
    <div class="nav-item" id="nav2" onclick="setTab(2)"><div class="nav-ico">💼</div><div class="nav-lbl">Portfolio</div></div>
  </div>
</div>

<!-- FORM -->
<div class="ov" id="ov-form" onclick="closeOv(event,'ov-form')">
  <div class="sheet">
    <div class="handle"></div>
    <div class="edit-bar" id="edit-bar" style="display:none">
      <span class="edit-lbl">Editando</span>
      <button class="edit-cancel" onclick="cancelEdit()">✕ Cancelar</button>
    </div>
    <div class="sheet-hdr">
      <span class="sheet-ttl" id="form-ttl">Nuevo movimiento</span>
      <button class="sheet-close" onclick="closeOv(null,'ov-form')">×</button>
    </div>
    <div class="sheet-body">
      <div class="type-toggle">
        <button class="type-btn ae" id="tb-e" onclick="setTipo('EGRESO')">▼ Egreso</button>
        <button class="type-btn" id="tb-i" onclick="setTipo('INGRESO')">▲ Ingreso</button>
      </div>
      <div class="amt-display">
        <span class="amt-cur">$U </span><span class="amt-num" id="amt-num">0</span>
      </div>
      <div class="numpad">
        <button class="np" onclick="npP('1')">1</button><button class="np" onclick="npP('2')">2</button><button class="np" onclick="npP('3')">3</button>
        <button class="np" onclick="npP('4')">4</button><button class="np" onclick="npP('5')">5</button><button class="np" onclick="npP('6')">6</button>
        <button class="np" onclick="npP('7')">7</button><button class="np" onclick="npP('8')">8</button><button class="np" onclick="npP('9')">9</button>
        <button class="np" onclick="npP('.')">⌁</button><button class="np" onclick="npP('0')">0</button><button class="np del" onclick="npDel()">⌫</button>
      </div>
      <div class="fg"><label class="fg-lbl">Motivo</label><input class="fi" type="text" id="f-motivo" placeholder="¿En qué?"></div>
      <div class="fg"><label class="fg-lbl">Categoría</label><div class="cat-grid" id="catgrid"></div></div>
      <div class="fg">
        <label class="fg-lbl">Fecha</label>
        <div class="chips">
          <div class="chip s" id="dc-h" onclick="setFecha('h')">Hoy</div>
          <div class="chip" id="dc-a" onclick="setFecha('a')">Ayer</div>
          <div class="chip" id="dc-o" onclick="setFecha('o')">📅 Elegir</div>
        </div>
        <input type="date" id="dhidden" onchange="setFechaCustom(this.value)">
      </div>
      <div class="fg">
        <label class="fg-lbl">Método</label>
        <div class="chips">
          <div class="chip s" id="mc-deb" onclick="setMet('Débito')">💳 Débito</div>
          <div class="chip" id="mc-ef" onclick="setMet('Efectivo')">💵 Efectivo</div>
          <div class="chip" id="mc-tr" onclick="setMet('Transferencia')">📱 Transferencia</div>
        </div>
      </div>
      <div class="fg"><label class="fg-lbl">Nota <span style="font-weight:400;text-transform:none;font-size:10px;color:var(--t3)">(opcional)</span></label><input class="fi" type="text" id="f-nota" placeholder="Detalle extra…"></div>
      <button class="savebtn" onclick="saveForm()">Guardar</button>
      <button class="delbtn" id="del-btn" onclick="askDel()" style="display:none">🗑 Eliminar movimiento</button>
    </div>
  </div>
</div>

<!-- CONFIRM -->
<div class="conf-dial" id="conf">
  <div class="conf-card">
    <div class="cc-ttl">¿Eliminar?</div>
    <p class="cc-sub">Esta acción no se puede deshacer.</p>
    <div class="cc-row">
      <button class="cc-cancel" onclick="closeConf()">Cancelar</button>
      <button class="cc-ok" onclick="doDelete()">Eliminar</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const CAT_E=[{k:'Alimentación',i:'🛒'},{k:'Comida afuera',i:'🍽️'},{k:'Bebidas/Social',i:'🍷'},{k:'Transporte',i:'🚌'},{k:'Moto',i:'🏍️'},{k:'Fitness',i:'💪'},{k:'Salud',i:'🏥'},{k:'Vivienda',i:'🏠'},{k:'Apps/Suscripciones',i:'📱'},{k:'Regalos',i:'🎁'},{k:'Tecnología',i:'💻'},{k:'Proyectos',i:'🌿'},{k:'Cuidado personal',i:'✂️'},{k:'Varios',i:'📦'}];
const CAT_I=[{k:'Sueldo Viatik',i:'💼'},{k:'Beats/BeatStars',i:'🎵'},{k:'Madreselva',i:'🌿'},{k:'Freelance web',i:'🖥️'},{k:'Inversiones',i:'📈'},{k:'Otros',i:'💰'}];
const ICO={};[...CAT_E,...CAT_I].forEach(c=>ICO[c.k]=c.i);
const CAT_COL={'Alimentación':'#16a34a','Comida afuera':'#ea580c','Bebidas/Social':'#9333ea','Transporte':'#2563eb','Moto':'#0891b2','Fitness':'#d97706','Salud':'#e11d48','Vivienda':'#7c3aed','Apps/Suscripciones':'#475569','Regalos':'#db2777','Tecnología':'#1d4ed8','Proyectos':'#059669','Cuidado personal':'#c2410c','Varios':'#9ca3af'};

const S={
  tab:0,month:new Date().getMonth()+1,year:new Date().getFullYear(),
  movs:[],loading:false,tipo:'EGRESO',cat:'',met:'Débito',
  fmod:'h',fcust:'',npStr:'',editId:null,editOM:null,editOY:null,pendDel:null,
  period:'mes',recOpen:false,recText:null,recLoading:false,
  url:localStorage.getItem('jfin_url')||'',
  usdRate:parseFloat(localStorage.getItem('jfin_usd')||'43'),
  goal:{amt:parseFloat(localStorage.getItem('jfin_goal')||'0'),cur:localStorage.getItem('jfin_gcur')||'UYU'},
  invs:JSON.parse(localStorage.getItem('jfin_invs')||JSON.stringify([
    {id:'franklin',name:'Franklin NextStep Moderate N ACUM',isin:'LU1350352388',cur:'USD',qty:59.6,buyPrice:16.78,curPrice:17.50,note:'Itaú Inversiones'},
    {id:'ttwo',name:'Take-Two Interactive (TTWO)',isin:'TTWO',cur:'USD',qty:0,buyPrice:0,curPrice:0,note:'Gletir'},
  ])),
};

// FORMAT — always full numbers
function fU(n){
  const a=Math.abs(n),s=n<0?'-':'';
  return s+'$U\u202f'+Math.round(a).toLocaleString('es-UY');
}
function fUSD(n){return '$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function p2(n){return String(n).padStart(2,'0')}
function todayS(){const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function yestS(){const d=new Date();d.setDate(d.getDate()-1);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function getF(){return S.fmod==='h'?todayS():S.fmod==='a'?yestS():S.fcust||todayS()}
function mFrom(ds){const[y,m]=ds.split('-').map(Number);return{m,y}}
function shortM(m,y){return MESES[m-1].slice(0,3)+" '"+String(y).slice(2)}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmtDateHdr(ds){
  const[y,m,d]=ds.split('-').map(Number);const dt=new Date(y,m-1,d);
  const t=new Date(),ye=new Date();ye.setDate(ye.getDate()-1);
  const sd=(a,b)=>a.getDate()===b.getDate()&&a.getMonth()===b.getMonth()&&a.getFullYear()===b.getFullYear();
  const wd=sd(dt,t)?'Hoy':sd(dt,ye)?'Ayer':dt.toLocaleDateString('es-UY',{weekday:'long'});
  return{day:d,wd,mo:dt.toLocaleDateString('es-UY',{month:'long',year:'numeric'})};
}

// CACHE
function ck(m,y){return`jfin3_${y||S.year}_${m||S.month}`}
function sc(d,m,y){try{localStorage.setItem(ck(m,y),JSON.stringify(d))}catch(e){}}
function lc(m,y){try{const d=localStorage.getItem(ck(m,y));return d?JSON.parse(d):null}catch(e){return null}}
function saveInvs(){try{localStorage.setItem('jfin_invs',JSON.stringify(S.invs))}catch(e){}}

// PERIOD
function getMovsPeriod(){
  if(S.period==='mes')return S.movs;
  if(S.period==='semana'){
    const now=new Date(),day=now.getDay(),diff=now.getDate()-day+(day===0?-6:1);
    const mon=new Date(now.getFullYear(),now.getMonth(),diff);
    const monS=mon.getFullYear()+'-'+p2(mon.getMonth()+1)+'-'+p2(mon.getDate());
    return S.movs.filter(m=>m.fecha>=monS);
  }
  let movs=[...S.movs];
  for(let i=1;i<=2;i++){let mo=S.month-i,y=S.year;if(mo<=0){mo+=12;y--;}movs=movs.concat(lc(mo,y)||[]);}
  return movs;
}

// API / GAS
function burl(p){try{const u=new URL(S.url);Object.entries(p).forEach(([k,v])=>u.searchParams.set(k,v??''));return u.toString()}catch(e){return null}}
async function af(p){const u=burl(p);if(!u)return null;try{const r=await fetch(u,{redirect:'follow'});if(!r.ok)throw 0;return await r.json();}catch(e){return null}}
async function loadMovs(){
  S.loading=true;renderContent();
  const c=lc();if(c){S.movs=c;S.loading=false;renderContent();}
  if(S.url){const r=await af({action:'get',month:S.month,year:S.year});if(r&&r.status==='ok'){S.movs=r.data||[];sc(S.movs);}}
  S.loading=false;renderContent();
}
async function apiAdd(m){S.movs.push(m);sc(S.movs);renderContent();if(!S.url)return;const{m:mo,y}=mFrom(m.fecha);af({action:'add',...m,month:mo,year:y});}
async function apiUpd(m){const i=S.movs.findIndex(x=>x.id===m.id);if(i>=0){S.movs[i]=m;sc(S.movs);}renderContent();if(!S.url)return;const{m:mo,y}=mFrom(m.fecha);af({action:'update',...m,month:mo,year:y,origMonth:S.editOM,origYear:S.editOY});}
async function apiDel(id){S.movs=S.movs.filter(x=>x.id!==id);sc(S.movs);renderContent();if(!S.url)return;af({action:'delete',id,month:S.editOM,year:S.editOY});}

// AI RECOMMENDATION
async function fetchRec(){
  const movs=S.movs;
  const cKey=`jfin_rec_${S.month}_${S.year}`;
  const cached=sessionStorage.getItem(cKey);
  if(cached){S.recText=cached;S.recLoading=false;updateRecUI();return;}
  S.recLoading=true;updateRecUI();
  const ing=movs.filter(m=>m.tipo==='INGRESO').reduce((a,m)=>a+parseFloat(m.monto||0),0);
  const egr=movs.filter(m=>m.tipo==='EGRESO').reduce((a,m)=>a+parseFloat(m.monto||0),0);
  const bal=ing-egr;
  const catT={};movs.filter(m=>m.tipo==='EGRESO').forEach(m=>{catT[m.categoria]=(catT[m.categoria]||0)+parseFloat(m.monto||0)});
  const top=Object.entries(catT).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([k,v])=>`${k}: ${fU(v)}`).join(', ');
  const prompt=`Sos un asesor financiero personal de Joaco, 25 años, uruguayo, trabaja en tech (Viatik, marketing) y tiene múltiples fuentes de ingreso.

Datos de ${MESES[S.month-1]} ${S.year}:
- Ingresos: ${fU(ing)}
- Egresos: ${fU(egr)}  
- Balance: ${fU(bal)}
- Categorías principales de gasto: ${top||'sin datos aún'}

Dá UNA recomendación concreta, específica, accionable. Máximo 3 oraciones. Tono directo, casual, inteligente — como un amigo que sabe de finanzas. No repitas los números. Escribí en español rioplatense con voseo. No uses emojis.`;
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,messages:[{role:'user',content:prompt}]})});
    const d=await r.json();
    const txt=d.content&&d.content[0]&&d.content[0].text?d.content[0].text:'No se pudo generar una recomendación.';
    S.recText=txt;sessionStorage.setItem(cKey,txt);
  }catch(e){S.recText='No se pudo generar una recomendación en este momento.';}
  S.recLoading=false;updateRecUI();
}
function updateRecUI(){
  const body=document.getElementById('rec-body');
  const chev=document.getElementById('rec-chev');
  if(!body)return;
  if(!S.recOpen){body.style.display='none';if(chev)chev.className='rec-chev';return;}
  body.style.display='block';if(chev)chev.className='rec-chev open';
  if(S.recLoading){
    body.innerHTML='<div class="rec-loading"><div class="rec-spin"></div><span>Analizando tu mes…</span></div>';
  } else {
    body.innerHTML=`<div class="rec-text">${esc(S.recText||'')}</div><button class="rec-refresh" onclick="refreshRec()">↺ Actualizar recomendación</button>`;
  }
}
function toggleRec(){
  S.recOpen=!S.recOpen;
  if(S.recOpen&&!S.recText&&!S.recLoading)fetchRec();
  else updateRecUI();
}
function refreshRec(){
  const cKey=`jfin_rec_${S.month}_${S.year}`;
  sessionStorage.removeItem(cKey);
  S.recText=null;
  fetchRec();
}

// RENDER
function renderML(){document.getElementById('mlbl').textContent=MESES[S.month-1]+' '+S.year}
function renderContent(){if(S.tab===0)renderTab0();else if(S.tab===1)renderTab1();else renderTab2();}

// TAB 0
function renderTab0(){
  const ing=S.movs.filter(m=>m.tipo==='INGRESO').reduce((a,m)=>a+parseFloat(m.monto||0),0);
  const egr=S.movs.filter(m=>m.tipo==='EGRESO').reduce((a,m)=>a+parseFloat(m.monto||0),0);
  const bal=ing-egr;
  let h=`<div class="home-card">
    <div class="saldo-top">
      <div class="saldo-lbl">Saldo total del mes</div>
      <div class="saldo-num ${bal>0?'pos':bal<0?'neg':''}">${fU(bal)}</div>
    </div>
    <div class="saldo-breakdown">
      <div class="saldo-row"><div class="saldo-row-l"><div class="saldo-ico g">↑</div>Ingresos</div><div class="saldo-val g">${fU(ing)}</div></div>
      <div class="saldo-row"><div class="saldo-row-l"><div class="saldo-ico r">↓</div>Gastos</div><div class="saldo-val r">${fU(egr)}</div></div>
      <div class="saldo-row"><div class="saldo-row-l"><div class="saldo-ico n">⚖</div>Balance</div><div class="saldo-val n ${bal>0?'pos':bal<0?'neg':''}">${fU(bal)}</div></div>
    </div>
    <div class="action-btns">
      <button class="act-btn egr" onclick="openAddTipo('EGRESO')">▼ Gasto</button>
      <button class="act-btn ing" onclick="openAddTipo('INGRESO')">▲ Ingreso</button>
    </div>
  </div>`;
  if(S.loading&&!S.movs.length){h+='<div class="spin"></div>';document.getElementById('tc').innerHTML=h;return;}
  const movs=[...S.movs].sort((a,b)=>b.fecha.localeCompare(a.fecha)||b.id.localeCompare(a.id));
  if(!movs.length){h+=`<div class="empty"><div class="empty-ico">📋</div><div class="empty-ttl">Sin movimientos</div><div class="empty-sub">Usá los botones de arriba para registrar</div></div>`;document.getElementById('tc').innerHTML=h;return;}
  const groups={};movs.forEach(m=>{if(!groups[m.fecha])groups[m.fecha]=[];groups[m.fecha].push(m)});
  Object.keys(groups).sort((a,b)=>b.localeCompare(a)).forEach(date=>{
    const{day,wd,mo}=fmtDateHdr(date);
    h+=`<div class="date-grp"><div class="date-hdr"><div class="date-day">${p2(day)}</div><div class="date-info"><div class="date-wd">${esc(wd)}</div><div class="date-mo">${esc(mo)}</div></div></div>`;
    groups[date].forEach(m=>{
      const c=m.tipo==='INGRESO'?'i':'e',s=m.tipo==='INGRESO'?'+':'-';
      h+=`<div class="mov-item">
        <div class="mov-main">
          <div class="mov-ico ${c}">${ICO[m.categoria]||'📌'}</div>
          <div class="mov-info">
            <div class="mov-motivo">${esc(m.motivo||m.categoria)}</div>
            <div class="mov-meta"><span class="cat-tag">${esc(m.categoria)}</span><span class="mov-met">· ${esc(m.metodo||'')}</span></div>
          </div>
          <div class="mov-btns">
            <button class="mov-tog" onclick="toggleAmt('${esc(m.id)}')" id="tog-${esc(m.id)}">▼</button>
            <button class="mov-edit" onclick="openEdit('${esc(m.id)}')">✏</button>
          </div>
        </div>
        <div id="amt-${esc(m.id)}" style="display:none">
          <div class="mov-amt-row">
            <span class="mov-amt ${c}">${s}${fU(m.monto)}</span>
            <span class="mov-date">${m.fecha.slice(8)}/${m.fecha.slice(5,7)}</span>
          </div>
          ${m.nota?`<div class="mov-nota">${esc(m.nota)}</div>`:''}
        </div>
      </div>`;
    });
    h+='</div>';
  });
  document.getElementById('tc').innerHTML=h;
}

function toggleAmt(id){
  const el=document.getElementById('amt-'+id);
  const btn=document.getElementById('tog-'+id);
  if(!el)return;
  const show=el.style.display==='none';
  el.style.display=show?'block':'none';
  if(btn)btn.textContent=show?'▲':'▼';
}

// TAB 1
function setPeriod(p){
  S.period=p;
  ['sem','mes','tri'].forEach(x=>{const m={sem:'semana',mes:'mes',tri:'trimestre'};const el=document.getElementById('ps-'+x);if(el)el.className='ps-btn'+(m[x]===p?' a':'');});
  S.recText=null;S.recOpen=false;
  renderTab1();
}

function renderTab1(){
  const movs=getMovsPeriod();
  const ing=movs.filter(m=>m.tipo==='INGRESO').reduce((a,m)=>a+parseFloat(m.monto||0),0);
  const egr=movs.filter(m=>m.tipo==='EGRESO').reduce((a,m)=>a+parseFloat(m.monto||0),0);
  const bal=ing-egr;
  let h='';
  const pLabel=S.period==='semana'?'esta semana':S.period==='trimestre'?'último trimestre':'este mes';

  if(S.period==='mes'&&S.goal.amt>0){
    let gUYU=S.goal.amt;if(S.goal.cur==='USD')gUYU*=S.usdRate;
    const pct=Math.min(100,Math.max(0,Math.round(bal/gUYU*100)));
    h+=`<div class="progress-card"><div class="prog-head"><span class="prog-ttl">Meta de ahorro</span><span class="prog-vals">${fU(bal)} / ${fU(gUYU)}</span></div><div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div><div class="prog-pct">${pct}% alcanzado</div></div>`;
  }

  h+=`<div class="chart-card"><div class="chart-title">Resumen · ${esc(pLabel)}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
    <div style="background:var(--grnl);border-radius:var(--rs);padding:10px 12px"><div style="font-size:10px;color:var(--grn);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">Ingresos</div><div style="font-size:16px;font-weight:700;color:var(--grn)">${fU(ing)}</div></div>
    <div style="background:var(--redl);border-radius:var(--rs);padding:10px 12px"><div style="font-size:10px;color:var(--red);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">Gastos</div><div style="font-size:16px;font-weight:700;color:var(--red)">${fU(egr)}</div></div>
  </div></div>`;

  const catT={};movs.filter(m=>m.tipo==='EGRESO').forEach(m=>{catT[m.categoria]=(catT[m.categoria]||0)+parseFloat(m.monto||0)});
  const catArr=Object.entries(catT).sort((a,b)=>b[1]-a[1]);
  if(catArr.length){
    h+=`<div class="chart-card" style="margin-top:12px"><div class="chart-title">Gastos por categoría</div>
    <div class="donut-wrap">${buildDonut(catArr,egr)}<div class="donut-legend">`;
    catArr.slice(0,5).forEach(([cat,amt])=>{const p=egr>0?Math.round(amt/egr*100):0;h+=`<div class="leg-item"><div class="leg-dot" style="background:${CAT_COL[cat]||'#9ca3af'}"></div><span class="leg-name">${esc(cat)}</span><span class="leg-pct">${p}%</span></div>`;});
    h+=`</div></div>`;
    catArr.forEach(([cat,amt])=>{const p=egr>0?Math.round(amt/egr*100):0;h+=`<div class="hbar-row"><span class="hbar-ico">${ICO[cat]||''}</span><span class="hbar-name">${esc(cat)}</span><div class="hbar-track"><div class="hbar-fill" style="width:${p}%;background:${CAT_COL[cat]||'#9ca3af'}"></div></div><span class="hbar-amt">${fU(amt)}</span></div>`;});
    h+=`</div>`;
  }

  if(S.period!=='semana'){
    const m4=[];
    for(let i=3;i>=0;i--){let mo=S.month-i,y=S.year;if(mo<=0){mo+=12;y--;}const data=lc(mo,y)||[];const b=data.reduce((a,mv)=>a+(mv.tipo==='INGRESO'?1:-1)*parseFloat(mv.monto||0),0);m4.push({label:shortM(mo,y),bal:b});}
    h+=`<div class="chart-card" style="margin-top:12px"><div class="chart-title">Tendencia 4 meses</div>${buildLine(m4)}<div class="trend-labels">${m4.map(d=>`<span class="trend-lbl">${esc(d.label)}</span>`).join('')}</div></div>`;
  }

  // AI Recommendation
  h+=`<div class="rec-card" style="margin-bottom:0">
    <div class="rec-header" onclick="toggleRec()">
      <div class="rec-title">✨ Recomendación del mes <span class="rec-badge">IA</span></div>
      <span class="rec-chev" id="rec-chev">▼</span>
    </div>
    <div id="rec-body" style="display:none"></div>
  </div>`;

  h+='<div style="height:8px"></div>';
  document.getElementById('tc').innerHTML=h;
  // Restore rec state if was open
  if(S.recOpen)updateRecUI();
}

function buildDonut(entries,total){
  const r=50,cx=65,cy=65,sw=13,circ=2*Math.PI*r;
  let offset=0,paths='';
  entries.forEach(([cat,amt])=>{const frac=total>0?amt/total:0;const dash=frac*circ;paths+=`<circle r="${r}" cx="${cx}" cy="${cy}" fill="none" stroke="${CAT_COL[cat]||'#9ca3af'}" stroke-width="${sw}" stroke-dasharray="${dash} ${circ}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"/>`;offset+=dash;});
  return`<svg width="130" height="130" viewBox="0 0 130 130" style="flex-shrink:0"><circle r="${r}" cx="${cx}" cy="${cy}" fill="none" stroke="var(--bg)" stroke-width="${sw}"/>${paths}<text x="${cx}" y="${cy-6}" text-anchor="middle" font-size="9" fill="var(--t3)" font-family="Inter">Total</text><text x="${cx}" y="${cy+8}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--t1)" font-family="Inter">${fU(total)}</text></svg>`;
}

function buildLine(m4){
  const vals=m4.map(d=>d.bal),mn=Math.min(...vals),mx=Math.max(...vals),range=mx-mn||1;
  const W=260,H=70,px=8;
  const pts=m4.map((d,i)=>({x:px+(i/(m4.length-1||1))*(W-px*2),y:H-px-((d.bal-mn)/range)*(H-px*2),bal:d.bal}));
  const pline=pts.map(p=>`${p.x},${p.y}`).join(' ');
  const area=`${pts[0].x},${H} `+pts.map(p=>`${p.x},${p.y}`).join(' ')+` ${pts[pts.length-1].x},${H}`;
  return`<svg width="100%" viewBox="0 0 276 ${H+16}" style="overflow:visible"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2563eb" stop-opacity=".12"/><stop offset="100%" stop-color="#2563eb" stop-opacity="0"/></linearGradient></defs><polygon points="${area}" fill="url(#lg)"/><polyline points="${pline}" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>${pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="var(--surf)" stroke="#2563eb" stroke-width="2"/><text x="${p.x}" y="${p.y-8}" text-anchor="middle" font-size="9" fill="var(--t2)" font-family="Inter">${p.bal>=0?'+':''}${fU(p.bal)}</text>`).join('')}</svg>`;
}

// TAB 2
function renderTab2(){
  const totUYU=S.invs.reduce((a,iv)=>a+(parseFloat(iv.qty||0)*parseFloat(iv.curPrice||0))*S.usdRate,0);
  const costUYU=S.invs.reduce((a,iv)=>a+(parseFloat(iv.qty||0)*parseFloat(iv.buyPrice||0))*S.usdRate,0);
  const pl=totUYU-costUYU;const plP=costUYU>0?((pl/costUYU)*100).toFixed(1):0;
  let h=`<div class="port-total"><div class="pt-lbl">Portfolio · USD → UYU</div><div class="pt-val">${fU(totUYU)}</div><div class="pt-sub">${pl>=0?'▲ +':'▼ '}${fU(pl)} (${pl>=0?'+':''}${plP}%) · Cambio: ${S.usdRate} UYU/USD</div></div>`;
  S.invs.forEach(iv=>{
    const qty=parseFloat(iv.qty||0),buy=parseFloat(iv.buyPrice||0),cur=parseFloat(iv.curPrice||0);
    const valUSD=qty*cur,costUSD=qty*buy,plUSD=valUSD-costUSD;
    const plPI=costUSD>0?((plUSD/costUSD)*100).toFixed(1):0;
    const abbr=iv.name.split(/[\s\/]/)[0].slice(0,4).toUpperCase();
    h+=`<div class="pos-card"><div class="pos-top"><div class="pos-ticker">${abbr}</div><div class="pos-inf"><div class="pos-name">${esc(iv.name)}</div><div class="pos-sub">${esc(iv.isin)} · ${esc(iv.note||'')}</div></div><div class="pos-r"><div class="pos-uyu">${fU(valUSD*S.usdRate)}</div><div class="pos-pl ${plUSD>=0?'up':'dn'}">${plUSD>=0?'▲':'▼'} ${fUSD(Math.abs(plUSD))} (${plUSD>=0?'+':''}${plPI}%)</div></div></div>
    <div class="pos-grid">
      <div><div class="pcl">Cuotas / Acc.</div><input type="number" class="pos-inp" style="color:var(--t1);border-color:var(--brd)" value="${qty||''}" placeholder="0" onchange="updInv('${iv.id}','qty',this.value)"></div>
      <div><div class="pcl">Compra USD</div><input type="number" class="pos-inp" style="color:var(--t1);border-color:var(--brd)" value="${buy||''}" placeholder="0.00" onchange="updInv('${iv.id}','buyPrice',this.value)"></div>
      <div><div class="pcl">Actual USD</div><input type="number" class="pos-inp" value="${cur||''}" placeholder="0.00" onchange="updInv('${iv.id}','curPrice',this.value)"></div>
    </div></div>`;
  });
  h+=`<div class="conf-section">
    <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--t3);padding:14px 0 6px">Configuración</div>
    <div class="conf-block"><div class="conf-lbl">Google Apps Script URL</div><input class="conf-inp" type="url" id="c-url" value="${esc(S.url)}" placeholder="https://script.google.com/macros/s/…"><div class="stat-row"><div class="stat-dot ${S.url?'ok':'off'}"></div><span class="stat-txt">${S.url?'Conectado a Google Sheets':'Sin conectar'}</span><button class="conf-btn" style="margin-left:auto;padding:8px 14px;font-size:12px" onclick="saveUrl()">Conectar</button></div></div>
    <div class="conf-block"><div class="conf-lbl">Tipo de cambio</div><div class="conf-row-i"><span class="conf-unit">1 USD =</span><input class="conf-inp-s" type="number" id="c-usd" value="${S.usdRate}" placeholder="43"><span class="conf-unit">UYU</span><button class="conf-btn" onclick="saveRate()">OK</button></div></div>
    <div class="conf-block"><div class="conf-lbl">Meta de ahorro mensual</div><div class="conf-row-i"><input class="conf-inp-s" type="number" id="c-goal" value="${S.goal.amt||''}" placeholder="0"><select class="conf-inp-s" id="c-gcur" style="max-width:80px;cursor:pointer"><option ${S.goal.cur==='UYU'?'selected':''}>UYU</option><option ${S.goal.cur==='USD'?'selected':''}>USD</option></select><button class="conf-btn" onclick="saveGoal()">OK</button></div></div>
  </div><div style="height:8px"></div>`;
  document.getElementById('tc').innerHTML=h;
}

function updInv(id,f,v){const iv=S.invs.find(x=>x.id===id);if(iv){iv[f]=parseFloat(v)||0;saveInvs();renderTab2();}}
function saveUrl(){const u=document.getElementById('c-url').value.trim();S.url=u;localStorage.setItem('jfin_url',u);toast(u?'Conectado ✓':'URL eliminada');loadMovs();renderTab2();}
function saveRate(){const r=parseFloat(document.getElementById('c-usd').value)||43;S.usdRate=r;localStorage.setItem('jfin_usd',r);toast('Tipo de cambio actualizado');renderTab2();}
function saveGoal(){const a=parseFloat(document.getElementById('c-goal').value)||0,c=document.getElementById('c-gcur').value;S.goal={amt:a,cur:c};localStorage.setItem('jfin_goal',a);localStorage.setItem('jfin_gcur',c);toast('Meta guardada');renderTab2();}

// NAV
function prevM(){S.month--;if(S.month<1){S.month=12;S.year--;}S.recText=null;renderML();loadMovs();}
function nextM(){S.month++;if(S.month>12){S.month=1;S.year++;}S.recText=null;renderML();loadMovs();}
function setTab(t){
  S.tab=t;[0,1,2].forEach(i=>{document.getElementById('nav'+i).className='nav-item'+(t===i?' a':'')});
  document.getElementById('period-bar').style.display=t===1?'flex':'none';
  renderContent();
}

// FORM
function openAddTipo(tipo){openAdd();setTipo(tipo);}
function openAdd(){
  S.editId=null;S.editOM=null;S.editOY=null;S.npStr='';renderAmtNum();
  setTipo('EGRESO');S.fmod='h';renderFechaChips();setMet('Débito');
  document.getElementById('f-motivo').value='';document.getElementById('f-nota').value='';
  document.getElementById('del-btn').style.display='none';
  document.getElementById('edit-bar').style.display='none';
  document.getElementById('form-ttl').textContent='Nuevo movimiento';
  document.getElementById('ov-form').classList.add('open');
}
function openEdit(id){
  const m=S.movs.find(x=>x.id===id);if(!m)return;
  S.editId=id;const{m:mo,y}=mFrom(m.fecha);S.editOM=mo;S.editOY=y;
  S.npStr=String(m.monto);renderAmtNum();setTipo(m.tipo);S.cat=m.categoria;renderCatGrid();
  if(m.fecha===todayS())S.fmod='h';else if(m.fecha===yestS())S.fmod='a';else{S.fmod='o';S.fcust=m.fecha;}
  renderFechaChips();setMet(m.metodo||'Débito');
  document.getElementById('f-motivo').value=m.motivo||'';
  document.getElementById('f-nota').value=m.nota||'';
  document.getElementById('del-btn').style.display='block';
  document.getElementById('edit-bar').style.display='flex';
  document.getElementById('form-ttl').textContent='Editar movimiento';
  document.getElementById('ov-form').classList.add('open');
}
function cancelEdit(){closeOv(null,'ov-form')}
function closeOv(e,id){if(e&&e.target.id!==id)return;document.getElementById(id).classList.remove('open')}
function setTipo(t){
  S.tipo=t;document.getElementById('tb-e').className='type-btn'+(t==='EGRESO'?' ae':'');document.getElementById('tb-i').className='type-btn'+(t==='INGRESO'?' ai':'');
  if(!S.editId){S.cat=(t==='INGRESO'?CAT_I:CAT_E)[0].k;}renderCatGrid();
}
function renderCatGrid(){
  const cats=S.tipo==='INGRESO'?CAT_I:CAT_E;const sc=S.tipo==='INGRESO'?'si':'se';
  document.getElementById('catgrid').innerHTML=cats.map(c=>`<div class="ccell${S.cat===c.k?' '+sc:''}" onclick="setCat('${esc(c.k)}')"><span class="cico">${c.i}</span><span class="cname">${esc(c.k)}</span></div>`).join('');
}
function setCat(k){S.cat=k;renderCatGrid()}
function setFecha(m){S.fmod=m;if(m==='o'){const inp=document.getElementById('dhidden');inp.value=S.fcust||todayS();inp.style.cssText='position:fixed;top:50%;left:50%;opacity:0;pointer-events:auto;width:1px;height:1px';inp.click();setTimeout(()=>{inp.style.pointerEvents='none'},200);}renderFechaChips();}
function setFechaCustom(v){S.fcust=v;S.fmod='o';renderFechaChips()}
function renderFechaChips(){
  ['h','a','o'].forEach(d=>{const el=document.getElementById('dc-'+d);if(el)el.className='chip'+(S.fmod===d?' s':'')});
  const oel=document.getElementById('dc-o');
  if(S.fmod==='o'&&S.fcust){const[y,m,dd]=S.fcust.split('-').map(Number);if(oel)oel.textContent='📅 '+new Date(y,m-1,dd).toLocaleDateString('es-UY',{day:'numeric',month:'short'});}
  else if(oel)oel.textContent='📅 Elegir';
}
function setMet(m){S.met=m;const map={Débito:'mc-deb',Efectivo:'mc-ef',Transferencia:'mc-tr'};Object.keys(map).forEach(k=>{const el=document.getElementById(map[k]);if(el)el.className='chip'+(k===m?' s':'')});}
function npP(v){if(v==='.'&&S.npStr.includes('.'))return;if(S.npStr==='0'&&v!=='.')S.npStr=v;else S.npStr+=v;if(S.npStr.length>10)S.npStr=S.npStr.slice(0,10);renderAmtNum();}
function npDel(){S.npStr=S.npStr.slice(0,-1);renderAmtNum()}
function renderAmtNum(){const s=S.npStr||'';if(!s){document.getElementById('amt-num').textContent='0';return}const pts=s.split('.');document.getElementById('amt-num').textContent=parseInt(pts[0]||'0').toLocaleString('es-UY')+(pts.length>1?','+(pts[1]||''):'');}
function saveForm(){
  const amt=parseFloat(S.npStr)||0;
  if(!amt||amt<=0){toast('Ingresá un monto');return}
  if(!S.cat){toast('Elegí una categoría');return}
  const fecha=getF();
  const m={id:S.editId||(Date.now()+Math.random().toString(36).slice(2,5)),fecha,tipo:S.tipo,categoria:S.cat,motivo:document.getElementById('f-motivo').value.trim()||S.cat,monto:amt,moneda:'UYU',metodo:S.met,nota:document.getElementById('f-nota').value.trim()};
  closeOv(null,'ov-form');
  if(S.editId){const{m:nm,y:ny}=mFrom(fecha);if(nm!==S.month||ny!==S.year){S.movs=S.movs.filter(x=>x.id!==S.editId);sc(S.movs);}apiUpd(m);toast('Actualizado ✓');}
  else{const{m:nm,y:ny}=mFrom(fecha);if(nm===S.month&&ny===S.year){apiAdd(m);toast('Guardado ✓');}else{const oc=lc(nm,ny)||[];oc.push(m);sc(oc,nm,ny);if(S.url)af({action:'add',...m,month:nm,year:ny});toast('Guardado en '+MESES[nm-1]+' ✓');}}
}
function askDel(){S.pendDel=S.editId;document.getElementById('conf').classList.add('open')}
function closeConf(){document.getElementById('conf').classList.remove('open')}
function doDelete(){closeConf();closeOv(null,'ov-form');if(S.pendDel){apiDel(S.pendDel);toast('Eliminado');}}
let _tt;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('on');clearTimeout(_tt);_tt=setTimeout(()=>el.classList.remove('on'),2400)}

(function(){
  renderML();renderContent();loadMovs();
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.ov.open').forEach(x=>x.classList.remove('open'));closeConf();}});
})();
</script>
</body>
